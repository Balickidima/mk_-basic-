; =============================================================================
; PlatformIO Configuration for STM32 CubeMX Projects
; =============================================================================
; ВАЖНО: Используем ТОЛЬКО HAL из проекта (Drivers/)
; Никаких изменений в HAL - полная совместимость с CubeIDE
; =============================================================================

[platformio]
src_dir = Core/Src
include_dir = Core/Inc
lib_dir = lib
test_dir = test
boards_dir = boards
default_envs = debug

; =============================================================================
; Base Configuration
; =============================================================================
[env:base]
platform = ststm32
board = stm32f401ccux

; Используем новый toolchain с GDB >= 9 (GNU Arm Embedded GCC 14.2.1)
platform_packages =
    platformio/toolchain-gccarmnoneeabi@^1.140201.0

; НЕ используем framework - берём ВСЁ из проекта
; Это позволяет использовать любой HAL из CubeMX
framework =

; Upload через ST-Link
; Для разных MCU может потребоваться разный target файл (stm32f1x.cfg, stm32f4x.cfg и т.д.)
; extra_script.py автоматически определяет правильный target и устанавливает UPLOAD_FLAGS
; Примечание: путь к OpenOCD жёстко задан - измените при переносе на другой ПК
upload_protocol = custom
upload_command = openocd -s "C:/Users/.platformio/packages/tool-openocd/openocd/scripts" -f interface/stlink.cfg -f target/$UPLOAD_FLAGS -c "init" -c "reset halt" -c "flash write_image erase .pio/build/debug/firmware.elf" -c "reset run" -c "shutdown"

; Extra scripts
extra_scripts =
    pre:extra_script.py
    post:fix_asflags.py
    post:copy_artifacts.py

; =============================================================================
; Debug Configuration
; =============================================================================
[env:debug]
extends = env:base
build_type = debug

build_flags =
    -DDEBUG
    -DUSE_HAL_DRIVER
    -DSTM32F401xC
    -O0
    -g3
    -ggdb
    -Wall
    -gdwarf-4
    -fno-omit-frame-pointer

; Убираем стандартные флаги отладки для ассемблера
build_unflags =
    -g2
    -g3
    -ggdb2
    -ggdb3

; Явно задаём ASFLAGS только с флагами процессора
; Это переопределит все флаги PlatformIO для ассемблера

; Настройки отладки для Cortex-Debug
debug_tool = stlink
debug_server =
    -g
    -ex
    set
    mi-async
    off
debug_init_break = tbreak main

; =============================================================================
; Release Configuration
; =============================================================================
[env:release]
extends = env:base
build_type = release

build_flags =
    -DNDEBUG
    -DUSE_HAL_DRIVER
    -DSTM32F401xC
    -Os